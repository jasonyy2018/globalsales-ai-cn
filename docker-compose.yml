version: '3.8'

services:
  globalsales-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: globalsales-ai
    restart: unless-stopped
    ports:
      - "${GS_PORT:-8766}:8766"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
      - PORT=8766
      - HOSTNAME=0.0.0.0
      - GS_PORT=8766
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8766/api/auth/me || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
