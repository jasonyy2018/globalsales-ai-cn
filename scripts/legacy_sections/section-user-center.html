<section class="section" id="section-user-center">
<div class="section-header">
<h2 data-i18n="uc.title">👤 用户中心</h2>
<p data-i18n="uc.subtitle">查看账户信息并修改登录密码</p>
</div>
<div class="card" style="max-width:520px;padding:24px;">
<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
<div id="ucAvatar" style="width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;">U</div>
<div>
<div id="ucName" style="font-size:18px;font-weight:700;">—</div>
<div id="ucRole" style="font-size:12px;color:var(--text-secondary);margin-top:2px;">—</div>
</div>
</div>
<div style="border-top:1px solid var(--border);padding-top:18px;">
<div data-i18n="uc.change_pw" style="font-size:14px;font-weight:600;margin-bottom:12px;">修改密码</div>
<input class="text-input" data-i18n-placeholder="uc.old_pw" id="ucOldPw" placeholder="当前密码" style="width:100%;margin-bottom:10px;" type="password"/>
<input class="text-input" data-i18n-placeholder="uc.new_pw" id="ucNewPw" placeholder="新密码（至少6位）" style="width:100%;margin-bottom:10px;" type="password"/>
<input class="text-input" data-i18n-placeholder="uc.new_pw2" id="ucNewPw2" placeholder="确认新密码" style="width:100%;margin-bottom:14px;" type="password"/>
<button class="btn btn-primary" data-i18n="uc.submit" id="ucBtnChange" onclick="ucChangePassword()">保存新密码</button>
<div id="ucMsg" style="margin-top:10px;font-size:13px;display:none;"></div>
</div>
<div style="border-top:1px solid var(--border);padding-top:18px;margin-top:18px;">
<div data-i18n="uc.workspace" style="font-size:14px;font-weight:600;margin-bottom:6px;">工作区</div>
<div data-i18n="uc.workspace_hint" style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;line-height:1.7;">输入框内容、商品情报、当前文章会自动保存，刷新或重新登录后自动恢复。如果某个状态卡住了，可以在这里清空。已保存的资产不受影响。</div>
<button class="btn btn-outline" data-i18n="uc.clear_workspace" onclick="clearWorkspace()">🧹 清空工作区</button>
</div>
</div>
</section>
