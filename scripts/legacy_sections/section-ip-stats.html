<section class="section" id="section-ip-stats">
<div class="section-header">
<h2 data-i18n="ip.title">🌐 访客IP统计</h2>
<p data-i18n="ip.subtitle">统计哪些IP访问过你的系统，包含IP地址、访问时间、持续时长、操作系统等信息</p>
</div>
<!-- 统计卡片 -->
<div class="ip-stats-summary" id="ipStatsSummary"></div>
<!-- 操作行 -->
<div class="ip-refresh-row">
<span data-i18n="ip.hint.local" style="font-size:12px;color:var(--text-secondary);">📌 数据保存在浏览器本地存储中</span>
<div style="display:flex;gap:8px;">
<button class="btn btn-outline btn-sm" data-i18n="ip.btn.clear" onclick="clearIPStats()">🗑️ 清空记录</button>
</div>
</div>
<!-- IP 访问表格 -->
<div style="overflow-x:auto;margin-top:12px;">
<table class="ip-stats-table" id="ipStatsTable">
<thead>
<tr>
<th>#</th>
<th>IP 地址</th>
<th>访问类型</th>
<th>IP 归属地</th>
<th>首次访问</th>
<th>最近活跃</th>
<th>持续时长</th>
<th>操作系统</th>
<th>访问次数</th>
</tr>
</thead>
<tbody id="ipStatsTbody">
<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary);">📡 暂无访客数据</td></tr>
</tbody>
</table>
</div>
</section>
