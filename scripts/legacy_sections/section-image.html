<section class="section" id="section-image">
<div class="section-header">
<h2 data-i18n="image.title">图片创作</h2>
<p data-i18n="image.subtitle">上传参考图 + 描述你的想法，AI 为你生成高质量图片。适用于电商主图、种草配图、社媒广告、达人人设图等场景。</p>
</div>
<!-- 参考图上传 -->
<div style="margin-bottom:16px;">
<label data-i18n="image.ref.label" style="font-size:13px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;">参考图（可选）</label>
<div class="image-upload-area" id="imageUploadArea" onclick="document.getElementById('imageRefInput').click()">
<div id="imageUploadPlaceholder" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
<svg fill="none" height="40" stroke="var(--text-secondary)" stroke-width="1.5" viewbox="0 0 24 24" width="40"><rect height="18" rx="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21,15 16,10 5,21"></polyline></svg>
<span data-i18n="image.ref.upload" style="font-size:13px;color:var(--text-secondary);">点击上传参考图，或直接拖拽到此处</span>
<span data-i18n="image.ref.formats" style="font-size:11px;color:var(--text-secondary);opacity:0.6;">支持 JPG / PNG / WebP，最大 10MB</span>
</div>
<img class="preview-img" id="imageRefPreview" style="display:none;"/>
<button class="remove-ref" id="imageRefRemove" onclick="event.stopPropagation();removeRefImage()" style="display:none;">✕</button>
</div>
<input accept="image/jpeg,image/png,image/webp" id="imageRefInput" onchange="handleRefImageUpload(event)" style="display:none;" type="file"/>
</div>
<!-- 文字描述 -->
<div style="margin-bottom:16px;">
<label data-i18n="image.prompt.label" for="imagePromptInput" style="font-size:13px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;">图片描述</label>
<textarea class="textarea" data-i18n-placeholder="image.prompt.placeholder" id="imagePromptInput" placeholder="描述你想要的图片，例如：电商主图、小红书种草平铺图、美食探店大片、型男穿搭街拍等..." style="min-height:100px;"></textarea>
<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
<button class="btn btn-outline btn-sm" data-i18n="image.prompt.optimize" id="btnOptimizeImagePrompt" onclick="optimizeImagePrompt()">AI优化提示词</button>
<div data-model-picker="image-prompt" data-picker-label="优化用模型" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</div>
<div style="margin-top:6px;">
<span data-i18n="image.prompt.optimize.hint" id="imagePromptOptimizeHint" style="font-size:12px;color:var(--text-secondary);">输入简单主题后，可用上面选的文本模型优化成专业级生图提示词</span>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin-top:10px;"><span data-i18n="image.chip.hint">热门提示词</span> <span data-i18n="image.chip.hint.subtitle" style="font-size:11px;">（点击快速填充）</span></div>
<div class="prompt-chip-row">
<button class="chip" onclick="fillImagePromptByIndex(0)">🛍️ 电商主图</button>
<button class="chip" onclick="fillImagePromptByIndex(1)">💄 美妆种草</button>
<button class="chip" onclick="fillImagePromptByIndex(2)">🕶️ 型男穿搭</button>
<button class="chip" onclick="fillImagePromptByIndex(3)">🍜 美食探店</button>
<button class="chip" onclick="fillImagePromptByIndex(4)">✈️ 旅游大片</button>
<button class="chip" onclick="fillImagePromptByIndex(5)">📱 数码评测</button>
<button class="chip" onclick="fillImagePromptByIndex(6)">📣 社媒广告</button>
<button class="chip" onclick="fillImagePromptByIndex(7)">🌿 素人种草</button>
<button class="chip" onclick="fillImagePromptByIndex(8)">🎉 大促海报</button>
<button class="chip" onclick="fillImagePromptByIndex(9)">🏠 家居好物</button>
</div>
</div>
<!-- 模型选择 + 生成数量 + 生成按钮 -->
<div class="image-generate-row" style="margin-bottom:16px;">
<div style="flex:1;">
<label data-i18n="image.model.label" style="font-size:13px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;">模型</label>
<div data-model-picker="image" data-picker-label="" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</div>
<div>
<label data-i18n="image.num.label" style="font-size:13px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;">数量</label>
<input class="num-input" id="imageNumInput" max="6" min="1" onchange="var v=parseInt(this.value);if(v&lt;1)this.value=1;if(v&gt;6)this.value=6;" style="width:70px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);font-size:14px;text-align:center;" type="number" value="3"/>
</div>
<button class="btn btn-primary btn-lg" id="btnGenerateImage" onclick="generateImages()" style="padding:10px 28px;">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><rect height="18" rx="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21,15 16,10 5,21"></polyline></svg>
<span data-i18n="image.btn.generate">生成图片</span>
</button>
</div>
<!-- 生成中 loading -->
<div id="imageLoading" style="display:none;text-align:center;padding:40px;">
<div style="width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent-light);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
<p data-i18n="image.loading" style="font-size:14px;color:var(--text-secondary);">AI 正在创作中，请稍候...</p>
<p data-i18n="image.loading.hint" style="font-size:12px;color:var(--text-secondary);opacity:0.6;margin-top:4px;">生成 3 张图片通常需要 5-10 秒；提示词直接以中文喂给国内生图模型，画面内文字约束为简体中文</p>
</div>
<!-- 结果展示 -->
<div id="imageResultSection" style="display:none;">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
<h3 data-i18n="image.result.title" style="font-size:15px;font-weight:600;">生成结果</h3>
<div style="display:flex;gap:8px;">
<button class="btn btn-outline btn-sm" onclick="regenerateImages()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><polyline points="1,4 1,10 7,10"></polyline><polyline points="23,20 23,14 17,14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
<span data-i18n="image.btn.regen">重新生成</span>
</button>
</div>
</div>
<div class="image-result-grid" id="imageResultGrid"></div>
</div>
</section>
