<section class="section" id="section-video">
<div class="section-header">
<h2 data-i18n="video.title">短视频生成</h2>
<p data-i18n="video.subtitle">由图文或商品情报驱动的短视频引擎 · 默认使用 Seedance 2 Mini · 生成后一键跳转至抖音 / 快手 / 视频号 / 小红书 后台上传</p>
</div>
<div class="video-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
<div>
<div class="card" style="margin-bottom:16px;">
<label style="font-size:14px;font-weight:500;display:block;margin-bottom:8px;">选择素材来源</label>
<select id="videoSource" style="width:100%;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;font-family:inherit;outline:none;">
<option value="">从已生成的文章中选择...</option>
</select>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
<span style="font-size:13px;color:var(--text-secondary);">发布平台：</span>
<button class="chip platform-chip active" onclick="selectVideoPlatform('douyin', this)">抖音</button>
<button class="chip platform-chip" onclick="selectVideoPlatform('kuaishou', this)">快手</button>
<button class="chip platform-chip" onclick="selectVideoPlatform('shipinhao', this)">微信视频号</button>
<button class="chip platform-chip" onclick="selectVideoPlatform('xiaohongshu', this)">小红书</button>
<button class="chip platform-chip" onclick="selectVideoPlatform('bilibili', this)">B站</button>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
<div data-model-picker="video-script" data-picker-label="脚本模型" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
<div data-model-picker="video" data-picker-label="视频模型" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</div>
<div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
<span style="font-size:13px;color:var(--text-secondary);">视频时长：</span>
<input id="videoDuration" max="60" min="5" onchange="validateDuration(this)" style="width:64px;padding:6px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:14px;font-family:inherit;text-align:center;" type="number" value="15"/>
<span style="font-size:13px;color:var(--text-secondary);">S</span>
</div>
<button class="btn btn-primary btn-lg" id="btnGenScript" onclick="generateScript()" style="width:100%;margin-top:16px;justify-content:center;">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><polygon points="5,3 19,12 5,21"></polygon></svg>
              生成短视频脚本
            </button>
</div>
<div class="animate-slide-up" id="scriptResult" style="display:none;">
<div style="font-size:14px;font-weight:600;margin-bottom:8px;">短视频脚本</div>
<div class="script-block" id="scriptContent"></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
<button class="btn btn-outline btn-sm" onclick="copyScript()">复制脚本</button>
<button class="btn btn-outline btn-sm" onclick="exportScript()">📄 导出脚本</button>
<button class="btn btn-outline btn-sm" id="btnEditScript" onclick="editScript()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                编辑脚本
              </button>
<button class="btn btn-primary btn-sm" id="btnGenVideo" onclick="generateVideo()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><polygon points="5,3 19,12 5,21"></polygon></svg>
                生成单段视频
              </button>
<button class="btn btn-primary btn-sm" id="btnGenFullVideo" onclick="generateFullVideo()" style="background:linear-gradient(135deg, #8b5cf6, #6366f1);">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><rect height="14" rx="2" width="20" x="2" y="3"></rect><polygon points="10,7 16,10 10,13"></polygon></svg>
                生成完整成片
              </button>
</div>
<div id="scriptEditActions" style="display:none;margin-top:8px;gap:8px;flex-wrap:wrap;">
<button class="btn btn-primary btn-sm" onclick="saveScript()">💾 保存脚本</button>
<button class="btn btn-outline btn-sm" onclick="cancelEditScript()">取消</button>
</div>
</div>
</div>
<div>
<div id="videoPreviewArea">
<div style="font-size:14px;font-weight:600;margin-bottom:12px;">视频预览</div>
<div class="video-preview" id="videoPreviewContainer">
<div style="text-align:center;color:var(--text-secondary);z-index:1;position:relative;">
<svg fill="none" height="48" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 12px;opacity:0.5;" viewbox="0 0 24 24" width="48"><rect height="14" rx="2" width="20" x="2" y="3"></rect><polygon points="10,7 16,10 10,13"></polygon></svg>
<p style="font-size:13px;">生成脚本后将在此预览视频</p>
</div>
</div>
</div>
<div class="animate-slide-up" id="videoResult" style="display:none;">
<div style="font-size:14px;font-weight:600;margin-bottom:12px;">生成的视频</div>
<div class="video-result-wrapper" id="videoResultWrapper"></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
<button class="btn btn-outline btn-sm" onclick="exportVideo()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><rect height="13" rx="2" width="13" x="9" y="9"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                导出视频
              </button>
<button class="btn btn-primary btn-sm" onclick="publishVideo()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><line x1="12" x2="12" y1="5" y2="19"></line><polyline points="19,12 12,19 5,12"></polyline></svg>
                跳转平台后台上传
              </button>
</div>
</div>
</div>
</div>
</section>
