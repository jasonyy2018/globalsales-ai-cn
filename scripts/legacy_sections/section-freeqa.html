<section class="section" id="section-freeqa">
<div class="section-header">
<h2 data-i18n="freeqa.title">💬 自由问答</h2>
<p data-i18n="freeqa.subtitle">像和人聊天一样提问：支持联网搜索、语音输入、上传图片/参考图。回答支持富文本、一键复制与导出。</p>
</div>
<!-- 输入区。整张卡都是拖拽落点（id=fqDropZone），不是只有某个小方块 ——
           用户拖图过来的直觉是"丢进这个对话框"，落点越大越不容易丢空。 -->
<div class="card" id="fqDropZone" style="padding:20px;margin-bottom:16px;border:2px solid transparent;">
<textarea class="textarea" data-i18n-placeholder="freeqa.placeholder" id="fqInput" placeholder="问点什么…（Enter 发送，Shift+Enter 换行，可拖拽或粘贴图片）" rows="3" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);font-size:14px;font-family:inherit;resize:vertical;"></textarea>
<!-- 语音听写实时预览：复用 toggleVoiceInput 的三参数约定（目标框 / 按钮 / 预览框） -->
<div class="voice-interim" id="fqVoiceInterim" style="display:none;"></div>
<!-- 已选图片的缩略图条，无图时整条隐藏 -->
<div id="fqImageBar" style="display:none;gap:8px;flex-wrap:wrap;margin-top:10px;"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;">
<button class="btn btn-outline btn-sm voice-btn" id="btnFqVoice" onclick="toggleVoiceInput('fqInput','btnFqVoice','fqVoiceInterim')">
<span class="voice-dot"></span>
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="23"></line><line x1="8" x2="16" y1="23" y2="23"></line></svg>
<span data-i18n="freeqa.voice" id="btnFqVoiceLabel">语音输入</span>
</button>
<!-- 图片输入：Agent Plan 端点实测支持多模态（content 传数组），不是摆设 -->
<button class="btn btn-outline btn-sm" onclick="document.getElementById('fqImageFile').click()">
<svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="14"><rect height="18" rx="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21,15 16,10 5,21"></polyline></svg>
<span data-i18n="freeqa.image">图片/参考图</span>
</button>
<input accept="image/*" id="fqImageFile" multiple="" onchange="fqHandleImagePick(this)" style="display:none;" type="file"/>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;">
<input id="fqWebSearch" style="cursor:pointer;" type="checkbox"/>
<span>🌐 <span data-i18n="freeqa.websearch">联网搜索</span></span>
</label>
<button class="btn btn-primary" id="btnFqSend" onclick="fqSend()" style="margin-left:auto;">
<svg fill="none" height="16" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="16"><line x1="22" x2="11" y1="2" y2="13"></line><polygon points="22,2 15,22 11,13 2,9"></polygon></svg>
<span data-i18n="freeqa.send" id="btnFqSendLabel">发送</span>
</button>
</div>
<div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;">
<div data-model-picker="freeqa" data-picker-label="问答模型" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</div>
<div style="font-size:11px;color:var(--text-secondary);line-height:1.7;margin-top:10px;">
          🎙 语音识别由浏览器完成，音频不经过本站服务器（需 Chrome / Edge / Safari）。
          🖼 上传图片后可直接问"这张图里是什么"。
          🌐 勾选联网搜索后，会先检索再作答并附来源。
        </div>
</div>
<!-- 回答区：高度受限，自身滚动，不挤占下方板块 -->
<div class="card" style="padding:0;overflow:hidden;">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);">
<span style="font-size:13px;font-weight:500;color:var(--text-secondary);">💬 <span data-i18n="freeqa.chat_title">对话记录</span></span>
<span id="fqTurnCount" style="font-size:11px;color:var(--text-secondary);"></span>
<!-- 明写排序方向：倒序在对话界面里不是默认预期，不说明的话用户会以为历史丢了 -->
<span data-i18n="freeqa.order_hint" style="font-size:11px;color:var(--text-secondary);opacity:.75;">（最新在最上）</span>
<button class="btn btn-outline btn-sm" data-i18n="freeqa.export_all" onclick="fqExportAll()" style="margin-left:auto;">导出全部</button>
<button class="btn btn-outline btn-sm" data-i18n="freeqa.clear" onclick="fqClear()">清空对话</button>
</div>
<div id="fqChatBox" style="max-height:460px;overflow-y:auto;padding:16px;"></div>
</div>
</section>
