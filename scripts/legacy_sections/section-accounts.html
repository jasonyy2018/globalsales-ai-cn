<section class="section" id="section-accounts">
<div class="section-header">
<h2 data-i18n="accounts.title">账号管理</h2>
<p data-i18n="accounts.subtitle">绑定你的多平台社媒账号，一站式管理数据、回复评论</p>
<button class="btn btn-primary btn-lg" onclick="openBindModal()" style="margin-top:12px;justify-content:center;padding:10px 24px;">
<svg fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><line x1="12" x2="12" y1="5" y2="19"></line><line x1="5" x2="19" y1="12" y2="12"></line></svg>
<span data-i18n="accounts.btn.add">添加账号</span>
</button>
</div>
<div class="account-grid" id="accountGrid"></div>
<div class="empty-state" id="accountsEmpty">
<div class="empty-icon">📱</div>
<p data-i18n="accounts.empty.title" style="font-size:16px;font-weight:500;margin-bottom:4px;">还没有绑定任何账号</p>
<p data-i18n="accounts.empty.hint" style="font-size:13px;">点击「添加账号」绑定你的抖音 / 小红书 / 快手 / 视频号 / 微信公众号 / 今日头条 / B站 账号</p>
</div>
</section>
